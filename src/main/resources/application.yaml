server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Log de SQL fica DESLIGADO por padrao: com a base do modo demo (centenas
    # de linhas), imprimir e formatar cada INSERT/SELECT trava o boot no plano
    # free. Pra estudar o SQL no console, subir com JPA_SHOW_SQL=true.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          # Manda os inserts em lote em vez de um round-trip por linha - o
          # seeder do demo grava ~340 registros de uma vez.
          batch_size: 50
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000 # 1h

  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  # Email que vira ADMIN automaticamente no primeiro login/cadastro - substitui
  # a necessidade de UPDATE manual direto no banco de produção.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}