server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000 # 1h

  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  # Email que vira ADMIN automaticamente no primeiro login/cadastro - substitui
  # a necessidade de UPDATE manual direto no banco de produção.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}